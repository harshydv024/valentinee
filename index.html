<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Khushi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle,#ff758c,#ff7eb3);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.card{
  background:white;
  padding:30px;
  border-radius:25px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.3);
  animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(.7);}
  to{opacity:1; transform:scale(1);}
}

h1{color:#e63946;}
p{color:#444; line-height:1.7;}

button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  font-size:17px;
  cursor:pointer;
  margin:10px;
}

.yes{
  background:#e63946;
  color:white;
  box-shadow:0 0 15px #e63946;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

.no{
  background:#ccc;
  position:absolute;
}

.heart{
  position:fixed;
  font-size:22px;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh); opacity:1;}
  to{transform:translateY(-10vh); opacity:0;}
}

.big-heart{
  font-size:100px;
  animation:boom 1s ease infinite alternate;
}

@keyframes boom{
  from{transform:scale(1);}
  to{transform:scale(1.3);}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Khushi 🥺❤️</h1>

  <p>
    mujhe sirf Valentine nahi chahiye… mujhe <b>poori zindagi ka saath</b> chahiye.
    Main jo bhi mehnat kar raha hoon, jo bhi sapne dekh raha hoon,
    <b>sab mein bas tu saath ho</b>.
    Zindagi jaisi bhi ho, agar tu mere saath hai
    toh <b>main har cheez jeet sakta hoon</b>.
    <br><br>
    — <b>tera Harsha</b>
  </p>

  <h2>Will you be my Valentine? 💘</h2>

  <button class="yes" onclick="yesClicked()">Yes 💖</button>
  <button class="no" onmouseover="moveNo()">No 😜</button>
</div>

<script>
function yesClicked(){
  document.body.innerHTML=`
  <div style="text-align:center;color:white;">
    <div class="big-heart">❤️</div>
    <h1>Yaaaay Khushi 🥹💖</h1>
    <h2>Forever Yours</h2>
    <p>— hamesha tera Harsha</p>
  </div>`;
  
  setInterval(createHeart,150);
}

function moveNo(){
  const btn=document.querySelector('.no');
  btn.style.left=Math.random()*80+"vw";
  btn.style.top=Math.random()*80+"vh";
}

function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(Math.random()*3+3)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}
</script>

</body>
</html>
